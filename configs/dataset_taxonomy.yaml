project:
  name: WasteWise AI
  version: "1.0"
  purpose: "Hierarchical waste classification and waste-domain expansion"

principles:
  - "Never modify raw datasets"
  - "Never overwrite original labels"
  - "Preserve source dataset and source label"
  - "Keep medical Dataset A and Dataset B separated"
  - "Keep TACO detection-oriented"
  - "Keep COCO outside the waste classifier"
  - "Perform cross-dataset deduplication before training"
  - "Use canonical labels only for model training"

core_classes:
  battery:
    family: e_waste
    description: "Batteries and battery packs"

  biological:
    family: organic_biological
    description: "Biological/organic waste"

  cardboard:
    family: recyclable
    description: "Cardboard and corrugated paper"

  clothes:
    family: textile_reusable
    description: "Clothing and textile items"

  glass:
    family: recyclable
    description: "Glass waste and glass containers"

  metal:
